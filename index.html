<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Manager</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
    <div>
        <h1>Cafe Manager</h1>
    </div>
    <div class="status" id="connectionStatus">Подключение...</div>
</header>

<main class="layout">
    <nav class="tabs" aria-label="Разделы">
        <button class="tab is-active" data-view="dashboard">Обзор</button>
        <button class="tab" data-view="menu">Меню</button>
        <button class="tab" data-view="customers">Клиенты</button>
        <button class="tab" data-view="tables">Столики</button>
        <button class="tab" data-view="orders">Заказы</button>
        <button class="tab" data-view="reservations">Брони</button>
    </nav>

    <section class="view is-active" id="dashboard">
        <div class="metrics">
            <article class="metric">
                <span>Категории</span>
                <strong id="metricCategories">0</strong>
            </article>
            <article class="metric">
                <span>Блюда</span>
                <strong id="metricMenu">0</strong>
            </article>
            <article class="metric">
                <span>Клиенты</span>
                <strong id="metricCustomers">0</strong>
            </article>
            <article class="metric">
                <span>Свободные столики</span>
                <strong id="metricTables">0</strong>
            </article>
            <article class="metric">
                <span>Заказы</span>
                <strong id="metricOrders">0</strong>
            </article>
        </div>
        <div class="split">
            <section class="panel">
                <div class="section-title">
                    <h2>Последние заказы</h2>
                    <button class="ghost" data-refresh>Обновить</button>
                </div>
                <div class="list compact-list" id="dashboardOrders"></div>
            </section>
            <section class="panel">
                <div class="section-title">
                    <h2>Ближайшие брони</h2>
                </div>
                <div class="list compact-list" id="dashboardReservations"></div>
            </section>
        </div>
    </section>

    <section class="view" id="menu">
        <div class="split">
            <section class="panel">
                <div class="section-title">
                    <h2>Категории</h2>
                    <button class="ghost" data-reset-form="categoryForm">Очистить</button>
                </div>
                <form class="form" id="categoryForm">
                    <input type="hidden" name="id">
                    <label>
                        Название
                        <input name="name" maxlength="120" required placeholder="Например, Coffee">
                    </label>
                    <label>
                        Описание
                        <textarea name="description" maxlength="500" rows="3" placeholder="Короткое описание"></textarea>
                    </label>
                    <button class="primary" type="submit">Сохранить категорию</button>
                </form>
                <div class="list" id="categoryList"></div>
            </section>

            <section class="panel">
                <div class="section-title">
                    <h2>Позиции меню</h2>
                    <button class="ghost" data-reset-form="menuItemForm">Очистить</button>
                </div>
                <form class="form" id="menuItemForm">
                    <input type="hidden" name="id">
                    <label>
                        Название
                        <input name="name" maxlength="160" required placeholder="Например, Cappuccino">
                    </label>
                    <label>
                        Категория
                        <select name="categoryId" required></select>
                    </label>
                    <label>
                        Цена
                        <input name="price" type="number" min="0" step="0.01" required placeholder="950">
                    </label>
                    <label>
                        Описание
                        <textarea name="description" maxlength="800" rows="3" placeholder="Состав или заметка"></textarea>
                    </label>
                    <label class="checkline">
                        <input name="available" type="checkbox" checked>
                        Доступно
                    </label>
                    <button class="primary" type="submit">Сохранить блюдо</button>
                </form>
                <div class="list" id="menuItemList"></div>
            </section>
        </div>
    </section>

    <section class="view" id="customers">
        <section class="panel">
            <div class="section-title">
                <h2>Клиенты</h2>
                <button class="ghost" data-reset-form="customerForm">Очистить</button>
            </div>
            <form class="form grid-form" id="customerForm">
                <input type="hidden" name="id">
                <label>
                    Имя
                    <input name="fullName" maxlength="160" required placeholder="Имя клиента">
                </label>
                <label>
                    Телефон
                    <input name="phone" maxlength="40" required placeholder="+77010000000">
                </label>
                <label>
                    Email
                    <input name="email" type="email" maxlength="160" placeholder="client@example.com">
                </label>
                <button class="primary align-end" type="submit">Сохранить клиента</button>
            </form>
            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Имя</th>
                        <th>Телефон</th>
                        <th>Email</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody id="customerRows"></tbody>
                </table>
            </div>
        </section>
    </section>

    <section class="view" id="tables">
        <section class="panel">
            <div class="section-title">
                <h2>Столики</h2>
                <button class="ghost" data-reset-form="tableForm">Очистить</button>
            </div>
            <form class="form grid-form" id="tableForm">
                <input type="hidden" name="id">
                <label>
                    Номер
                    <input name="tableNumber" type="number" min="1" required placeholder="1">
                </label>
                <label>
                    Места
                    <input name="seats" type="number" min="1" required placeholder="4">
                </label>
                <label>
                    Зона
                    <input name="location" maxlength="120" placeholder="Main hall">
                </label>
                <label class="checkline align-end">
                    <input name="available" type="checkbox" checked>
                    Свободен
                </label>
                <button class="primary align-end" type="submit">Сохранить столик</button>
            </form>
            <div class="list card-grid" id="tableList"></div>
        </section>
    </section>

    <section class="view" id="orders">
        <div class="split">
            <section class="panel">
                <div class="section-title">
                    <h2>Новый заказ</h2>
                </div>
                <form class="form" id="orderForm">
                    <label>
                        Клиент
                        <select name="customerId" required></select>
                    </label>
                    <label>
                        Столик
                        <select name="tableId"></select>
                    </label>
                    <label>
                        Блюдо
                        <select name="menuItemId" required></select>
                    </label>
                    <label>
                        Количество
                        <input name="quantity" type="number" min="1" value="1" required>
                    </label>
                    <button class="primary" type="submit">Создать заказ</button>
                </form>
            </section>
            <section class="panel">
                <div class="section-title">
                    <h2>Заказы</h2>
                    <button class="ghost" data-refresh>Обновить</button>
                </div>
                <div class="list" id="orderList"></div>
            </section>
        </div>
    </section>

    <section class="view" id="reservations">
        <div class="split">
            <section class="panel">
                <div class="section-title">
                    <h2>Бронирование</h2>
                    <button class="ghost" data-reset-form="reservationForm">Очистить</button>
                </div>
                <form class="form" id="reservationForm">
                    <input type="hidden" name="id">
                    <label>
                        Клиент
                        <select name="customerId" required></select>
                    </label>
                    <label>
                        Столик
                        <select name="tableId" required></select>
                    </label>
                    <label>
                        Время
                        <input name="reservationTime" type="datetime-local" required>
                    </label>
                    <label>
                        Гостей
                        <input name="guestCount" type="number" min="1" required value="2">
                    </label>
                    <label>
                        Статус
                        <select name="status">
                            <option value="PENDING">PENDING</option>
                            <option value="CONFIRMED">CONFIRMED</option>
                            <option value="CANCELLED">CANCELLED</option>
                            <option value="COMPLETED">COMPLETED</option>
                        </select>
                    </label>
                    <label>
                        Комментарий
                        <textarea name="comment" maxlength="500" rows="3"></textarea>
                    </label>
                    <button class="primary" type="submit">Сохранить бронь</button>
                </form>
            </section>
            <section class="panel">
                <div class="section-title">
                    <h2>Брони</h2>
                    <button class="ghost" data-refresh>Обновить</button>
                </div>
                <div class="list" id="reservationList"></div>
            </section>
        </div>
    </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
